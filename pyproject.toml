[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picfind"
version = "0.1.0"
description = "Small LSB steganography CLI (PicFind)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["Pillow>=10.0.0", "cryptography>=40.0.0"]

[project.scripts]
picfind = "stego:main"
